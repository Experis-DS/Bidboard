<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 128" role="img" aria-label="A draft client deck: a slide in a browser frame with review comments and a draft stamp">
  <rect width="200" height="128" rx="8" fill="#F8F8FB"/>
  <rect x="1" y="1" width="198" height="126" rx="7.5" fill="none" stroke="#E6E5F0"/>
  <!-- browser frame -->
  <rect x="14" y="14" width="172" height="100" rx="6" fill="#fff" stroke="#E6E5F0"/>
  <path d="M14 20a6 6 0 0 1 6-6h160a6 6 0 0 1 6 6v6H14z" fill="#F0EFF6"/>
  <circle cx="24" cy="20" r="2" fill="#D6D3EA"/><circle cx="31" cy="20" r="2" fill="#D6D3EA"/><circle cx="38" cy="20" r="2" fill="#D6D3EA"/>
  <!-- slide content -->
  <rect x="26" y="38" width="30" height="3" rx="1.5" fill="#5241B5"/>
  <rect x="26" y="47" width="86" height="8" rx="2" fill="#22242B"/>
  <rect x="26" y="61" width="70" height="2.5" rx="1.25" fill="#D6D3EA"/>
  <rect x="26" y="68" width="58" height="2.5" rx="1.25" fill="#D6D3EA"/>
  <rect x="124" y="38" width="50" height="42" rx="4" fill="#EEEBFA"/>
  <!-- slide dots -->
  <rect x="26" y="96" width="14" height="3" rx="1.5" fill="#5241B5"/>
  <rect x="44" y="96" width="14" height="3" rx="1.5" fill="#D6D3EA"/>
  <rect x="62" y="96" width="14" height="3" rx="1.5" fill="#D6D3EA"/>
  <rect x="80" y="96" width="14" height="3" rx="1.5" fill="#D6D3EA"/>
  <!-- draft stamp -->
  <rect x="26" y="104" width="34" height="6" rx="3" fill="#fff" stroke="#C9C6DE"/>
  <rect x="30" y="106" width="18" height="2" rx="1" fill="#74767D"/>
  <!-- comment bubble -->
  <g>
    <path d="M140 88h34a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5h-24l-6 6v-6h-4a5 5 0 0 1-5-5V93a5 5 0 0 1 5-5z" fill="#5241B5"/>
    <rect x="144" y="95" width="22" height="2" rx="1" fill="#fff" opacity=".85"/>
    <rect x="144" y="100" width="15" height="2" rx="1" fill="#fff" opacity=".55"/>
  </g>
</svg>
