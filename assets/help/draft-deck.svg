<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" role="img"
     aria-label="The draft deck: a click-through microsite with a draft watermark and a version stamp">
  <style>
    .ln { fill:none; stroke:#22242B; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .hair { fill:none; stroke:#C9C6DE; stroke-width:2; stroke-linecap:round; }
    .acc { fill:none; stroke:#5241B5; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .rise { animation: rise 3.6s ease-in-out infinite; }
    @keyframes rise { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }
    @media (prefers-reduced-motion: reduce) { .rise { animation:none } }
  </style>

  <!-- stacked slides, the back two receding -->
  <g opacity=".45">
    <rect x="52" y="30" width="150" height="94" rx="7" fill="#fff" class="hair"/>
    <rect x="44" y="38" width="150" height="94" rx="7" fill="#fff" class="hair"/>
  </g>

  <g transform="translate(30 46)"><g class="rise">
    <rect x="0" y="0" width="164" height="100" rx="7" fill="#fff" class="ln"/>
    <!-- browser chrome -->
    <rect x="0" y="0" width="164" height="14" rx="7" fill="#F8F8FB" class="hair"/>
    <circle cx="11" cy="7" r="2.4" fill="#C9C6DE"/>
    <circle cx="20" cy="7" r="2.4" fill="#C9C6DE"/>
    <circle cx="29" cy="7" r="2.4" fill="#C9C6DE"/>
    <!-- hero -->
    <line x1="14" y1="34" x2="86" y2="34" class="ln"/>
    <line x1="14" y1="46" x2="118" y2="46" class="hair"/>
    <line x1="14" y1="56" x2="100" y2="56" class="hair"/>
    <rect x="14" y="68" width="46" height="16" rx="8" fill="#EEEBFA" class="acc"/>
    <!-- side panel hint -->
    <line x1="132" y1="34" x2="150" y2="34" class="hair"/>
    <line x1="132" y1="44" x2="150" y2="44" class="hair"/>
    <line x1="132" y1="54" x2="144" y2="54" class="hair"/>
  </g></g>

  <!-- DRAFT stamp, angled -->
  <g transform="translate(150 104) rotate(-8)">
    <rect x="0" y="0" width="76" height="26" rx="6" fill="#fff" class="acc"/>
    <text x="38" y="18" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" font-weight="700" letter-spacing="1.5" fill="#5241B5">DRAFT</text>
  </g>
  <text x="46" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#5F6169">v0.3 · not for the client</text>
</svg>
