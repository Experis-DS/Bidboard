<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" role="img"
     aria-label="Download the slash rfp skill from the Skills page and load it into your AI assistant">
  <style>
    .ln { fill:none; stroke:#22242B; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .hair { fill:none; stroke:#C9C6DE; stroke-width:2; stroke-linecap:round; }
    .acc { fill:none; stroke:#5241B5; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .arrow { animation: pull 3s ease-in-out infinite; }
    .file  { animation: land 3s ease-in-out infinite; }
    @keyframes pull { 0%,20% { transform:translateY(-4px); opacity:.3 } 45% { transform:translateY(4px); opacity:1 } 70%,100% { transform:translateY(8px); opacity:0 } }
    @keyframes land { 0%,50% { opacity:0; transform:translateY(-6px) } 66%,92% { opacity:1; transform:translateY(0) } 100% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) {
      .arrow,.file { animation:none }
      .arrow { opacity:1; transform:none } .file { opacity:1; transform:none }
    }
  </style>

  <!-- the Skills page -->
  <rect x="18" y="16" width="164" height="106" rx="8" fill="#fff" class="ln"/>
  <path class="ln" d="M18 24a8 8 0 0 1 8-8h148a8 8 0 0 1 8 8v8H18z"/>
  <circle cx="30" cy="24" r="2.4" fill="#C9C6DE"/>
  <circle cx="39" cy="24" r="2.4" fill="#C9C6DE"/>
  <circle cx="48" cy="24" r="2.4" fill="#C9C6DE"/>

  <!-- highlighted row -->
  <rect x="30" y="44" width="140" height="30" rx="6" fill="#fff" class="acc"/>
  <text x="42" y="57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" font-weight="700" fill="#5241B5">/rfp</text>
  <line x1="42" y1="65" x2="96" y2="65" class="hair"/>
  <rect x="126" y="51" width="34" height="16" rx="8" fill="#5241B5"/>
  <path d="M139 56v6m0 0l-3-3m3 3l3-3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- other rows, muted -->
  <line x1="30" y1="88"  x2="120" y2="88"  class="hair"/>
  <line x1="30" y1="98"  x2="96"  y2="98"  class="hair"/>
  <line x1="30" y1="108" x2="112" y2="108" class="hair"/>

  <!-- download arrow -->
  <g class="arrow">
    <path class="acc" d="M200 34v34"/>
    <path class="acc" d="M192 60l8 8 8-8"/>
  </g>

  <!-- the skill file, landing -->
  <g class="file">
    <rect x="176" y="80" width="48" height="58" rx="6" fill="#fff" class="ln"/>
    <path class="ln" d="M210 80v14h14"/>
    <line x1="186" y1="108" x2="212" y2="108" class="hair"/>
    <line x1="186" y1="118" x2="204" y2="118" class="hair"/>
    <text x="200" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="8" font-weight="700" fill="#5241B5">.skill</text>
  </g>

  <!-- into your assistant -->
  <g transform="translate(46 144)">
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#F8F8FB" class="hair"/>
    <circle cx="18" cy="12" r="5" class="acc"/>
    <text x="34" y="16" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="11" fill="#5F6169">your AI assistant</text>
  </g>
</svg>
