<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" role="img"
     aria-label="Open the folder of RFP documents in your AI assistant and type run slash rfp">
  <style>
    .ln { fill:none; stroke:#22242B; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .hair { fill:none; stroke:#C9C6DE; stroke-width:2; stroke-linecap:round; }
    .acc { fill:none; stroke:#5241B5; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .caret { fill:#5241B5; animation: blink 1.1s steps(1) infinite; }
    .sheet { animation: settle 3.6s ease-in-out infinite; }
    .sheet:nth-of-type(2) { animation-delay:.18s; }
    .sheet:nth-of-type(3) { animation-delay:.36s; }
    @keyframes blink { 0%,55% { opacity:1 } 56%,100% { opacity:0 } }
    @keyframes settle { 0%,70%,100% { transform:translateY(0) } 78% { transform:translateY(-3px) } }
    @media (prefers-reduced-motion: reduce) { .caret,.sheet { animation:none } }
  </style>

  <!-- documents -->
  <g transform="translate(0 -4)">
    <g class="sheet"><rect x="70" y="26" width="46" height="58" rx="4" class="hair"/></g>
    <g class="sheet"><rect x="88" y="20" width="46" height="58" rx="4" fill="#fff" class="hair"/></g>
    <g class="sheet">
      <rect x="106" y="14" width="52" height="64" rx="4" fill="#fff" class="ln"/>
      <line x1="116" y1="30" x2="146" y2="30" class="hair"/>
      <line x1="116" y1="40" x2="140" y2="40" class="hair"/>
      <line x1="116" y1="50" x2="148" y2="50" class="hair"/>
      <line x1="116" y1="60" x2="132" y2="60" class="hair"/>
    </g>
  </g>

  <!-- folder -->
  <path class="ln" d="M40 92h34l9 11h97a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8v-51a8 8 0 0 1 8-8z"/>
  <path class="hair" d="M32 116h156"/>

  <!-- prompt bar -->
  <g transform="translate(56 128)">
    <rect x="0" y="0" width="122" height="26" rx="13" fill="#fff" class="acc"/>
    <text x="14" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" font-weight="600" fill="#5241B5">/rfp</text>
    <rect class="caret" x="50" y="7" width="2" height="13" rx="1"/>
  </g>
</svg>
