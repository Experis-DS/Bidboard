<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" role="img"
     aria-label="Your assistant hands back a single zip file whose name ends in rfp bundle dot zip">
  <style>
    .ln { fill:none; stroke:#22242B; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .hair { fill:none; stroke:#C9C6DE; stroke-width:2; stroke-linecap:round; }
    .acc { fill:none; stroke:#5241B5; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .drop { animation: drop 3.2s ease-in-out infinite; }
    .arrow { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes drop { 0%,100% { transform:translateY(0) } 50% { transform:translateY(5px) } }
    @keyframes pulse { 0%,100% { opacity:.35 } 45% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .drop,.arrow { animation:none; opacity:1 } }
  </style>

  <!-- source documents, small and receding -->
  <g opacity=".5">
    <rect x="26" y="26" width="30" height="38" rx="3" class="hair"/>
    <rect x="36" y="20" width="30" height="38" rx="3" fill="#fff" class="hair"/>
    <rect x="46" y="14" width="30" height="38" rx="3" fill="#fff" class="hair"/>
  </g>

  <!-- funnel: many in, one out -->
  <g class="arrow">
    <path class="acc" d="M92 34h44"/>
    <path class="acc" d="M128 26l9 8-9 8"/>
  </g>

  <!-- the bundle. Position on the OUTER group: a CSS transform on the animated
       element replaces the transform attribute, which would reset it to 0,0. -->
  <g transform="translate(148 8)"><g class="drop">
    <rect x="0" y="0" width="76" height="94" rx="7" fill="#fff" class="ln"/>
    <!-- zip tab -->
    <rect x="30" y="0" width="16" height="30" rx="3" fill="#EEEBFA" class="acc"/>
    <line x1="38" y1="6"  x2="38" y2="10" class="acc"/>
    <line x1="38" y1="15" x2="38" y2="19" class="acc"/>
    <rect x="32" y="30" width="12" height="14" rx="3" class="acc" fill="#fff"/>
    <circle cx="38" cy="37" r="2" fill="#5241B5"/>
    <!-- contents hint -->
    <line x1="14" y1="60" x2="62" y2="60" class="hair"/>
    <line x1="14" y1="70" x2="52" y2="70" class="hair"/>
    <line x1="14" y1="80" x2="58" y2="80" class="hair"/>
  </g></g>

  <!-- filename plate -->
  <g transform="translate(40 126)">
    <rect x="0" y="0" width="180" height="30" rx="8" fill="#F8F8FB" class="hair"/>
    <text x="90" y="20" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5F6169">…rfp-bundle.zip</text>
  </g>
</svg>
